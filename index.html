<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f4c92">
<title>山西考德上 · 公考AI实验室</title>
<style>
:root{--blue:#0f4c92;--blue2:#1c69bd;--ink:#172231;--muted:#6c7785;--bg:#f4f7fb;--line:#e1e7ef}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:720px;margin:auto;padding:14px 13px 50px}
.hero{background:linear-gradient(145deg,#0a356c,#1b68b8);color:white;border-radius:24px;padding:26px 20px;box-shadow:0 15px 35px #0a356c33}
.brand{font-size:13px;opacity:.9;letter-spacing:.8px}h1{font-size:28px;line-height:1.2;margin:12px 0 9px}.sub{font-size:14px;line-height:1.7;opacity:.93}
.card{background:#fff;border-radius:19px;padding:19px;margin:13px 0;box-shadow:0 5px 20px #1722310b}
button{border:0;width:100%;padding:14px;border-radius:13px;background:var(--blue2);color:#fff;font-size:16px;font-weight:800}
.secondary{background:#eef4fb;color:var(--blue)}.small{font-size:12px;color:var(--muted)}.notice{background:#fff8e7;border-left:4px solid #e1a32c;padding:11px 12px;border-radius:8px;font-size:13px;line-height:1.65}
.progress{height:7px;background:#e8edf4;border-radius:99px;overflow:hidden;margin:8px 0 18px}.bar{height:100%;background:var(--blue2);transition:.2s}
.q{font-size:19px;font-weight:800;line-height:1.5;margin:8px 0 16px}.opt{display:block;border:1px solid var(--line);border-radius:13px;padding:13px;margin:9px 0;line-height:1.5}
.opt:has(input:checked){border-color:var(--blue2);background:#f1f7ff}.opt input{margin-right:8px}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.score{background:#f6f8fb;border-radius:13px;padding:12px}.score b{display:block;font-size:24px;margin-top:4px}
.input{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;font-size:16px;margin:5px 0 10px;outline:none}
.consent{display:flex;gap:8px;align-items:flex-start;font-size:12px;color:var(--muted);line-height:1.6;margin:10px 0}
.hidden{display:none!important}h2{font-size:21px;margin:3px 0 10px}h3{font-size:16px;margin:18px 0 7px}p,li{line-height:1.75}
.type{color:var(--blue2);font-weight:800;font-size:14px}.report-title{font-size:27px;font-weight:900}
.tag{display:inline-block;background:#edf5ff;color:var(--blue);border-radius:20px;padding:6px 9px;margin:3px;font-size:12px}
footer{text-align:center;color:#929ba6;font-size:11px;margin-top:18px}
</style>
</head>
<body>
<div class="wrap">
<section class="hero">
<div class="brand">山西考德上 · 公考AI实验室</div>
<h1>测一测你的公考备考画像</h1>
<div class="sub">20道题 · 约5分钟 · 五维能力分析 · 个性化7天行动建议</div>
</section>
<div id="app"></div>
<footer>山西考德上 · 公考AI实验室活动版</footer>
</div>
<script>
const QUESTIONS=[["基础水平", "你最近一次行测成绩大约是多少？", ["50分以下", "50～60分", "60～70分", "70分以上", "还没有参加过正式考试"]], ["基础水平", "你最近一次申论成绩大约是多少？", ["50分以下", "50～60分", "60～70分", "70分以上", "还没有参加过正式考试"]], ["基础水平", "你对行测各模块的熟悉程度？", ["基本都不了解", "了解部分模块", "大部分模块都会做", "已经有比较成熟的做题方法"]], ["基础水平", "你做一套完整行测时，通常能完成多少？", ["不到一半", "一半左右", "大部分", "基本全部"]], ["学习效率", "你每天实际能用于公考学习的时间？", ["1小时以内", "1～3小时", "3～5小时", "5小时以上"]], ["学习效率", "学习1小时后，你通常能保持多久有效专注？", ["20分钟以内", "20～40分钟", "40～50分钟", "50分钟以上"]], ["学习效率", "做完一套题之后，你通常会？", ["对完答案就结束", "简单看错题", "分析错误原因", "分类复盘并重新训练"]], ["学习效率", "你学习新知识后多久复习？", ["基本不复习", "想起来才复习", "一周左右", "有固定复习计划"]], ["执行能力", "学习计划的实际完成情况？", ["经常完不成", "偶尔完成", "大部分完成", "基本按计划执行"]], ["执行能力", "当天状态不好时，你会？", ["直接不学", "少学一点", "调整任务继续", "完成最低任务量"]], ["执行能力", "连续学习一周后，你通常会？", ["很容易放弃", "偶尔中断", "基本坚持", "已形成稳定习惯"]], ["执行能力", "距离考试较远时，你的状态？", ["容易松懈", "偶尔焦虑", "有阶段规划", "提前安排阶段目标"]], ["应试能力", "做行测套题最常见的问题？", ["很多题不会", "会做但速度慢", "时间够但容易错", "速度和正确率都较稳定"]], ["应试能力", "遇到不会做的题，你通常？", ["一直纠结", "做很久再放弃", "判断后跳过", "有明确取舍策略"]], ["应试能力", "平时有没有限时训练？", ["从来没有", "偶尔", "每周会", "固定训练"]], ["应试能力", "模拟考试时状态？", ["和平时差别很大", "容易紧张", "基本稳定", "考试节奏稳定"]], ["备考状态", "你目前最大的困难？", ["不知道从哪开始", "效率不高", "坚持困难", "分数遇到瓶颈"]], ["备考状态", "你的考试目标明确程度？", ["没有明确目标", "大概知道方向", "目标明确", "已明确岗位/地区/考试安排"]], ["备考状态", "连续几次成绩不理想时，你会？", ["怀疑自己并放弃", "暂停几天", "分析后调整", "根据数据重做计划"]], ["备考状态", "你最希望获得哪种帮助？", ["完整学习计划", "专项方法", "老师针对性分析", "学习监督反馈"]]];
const DIMS=["基础水平","学习效率","执行能力","应试能力","备考状态"];
const API_URL="https://script.google.com/macros/s/AKfycbyoyJ12TxhRJ62oTFBV2bQ0PeXdVOSLP42vBpoUl8qutrjc9zwTp7Ck7v4hoAN_xIgGsw/exec"; // 部署后，把这里替换成你的 Google Apps Script Web App URL
let idx=0, answers=Array(QUESTIONS.length).fill(null), result=null;
const app=document.getElementById("app");

function home(){
app.innerHTML=`<div class="card">
<h2>欢迎进入公考AI实验室</h2>
<p>通过20道题，从基础、效率、执行、应试、备考状态五个维度了解当前备考情况。</p>
<div class="notice">本测评用于备考规划参考，不预测考试结果。提交联系方式前，请确认你同意用于本次活动的资料领取与后续课程/活动联系。</div>
<br><button onclick="start()">开始测评</button>
</div>`}
function start(){idx=0;answers.fill(null);renderQ()}
function renderQ(){
let q=QUESTIONS[idx];
app.innerHTML=`<div class="card">
<div class="small">${idx+1} / ${QUESTIONS.length} · ${q[0]}</div>
<div class="progress"><div class="bar" style="width:${(idx+1)/QUESTIONS.length*100}%"></div></div>
<div class="q">${q[1]}</div>
${q[2].map((o,k)=>`<label class="opt"><input type="radio" name="ans" value="${k}" ${answers[idx]===k?"checked":""}> ${String.fromCharCode(65+k)}. ${o}</label>`).join("")}
<div class="nav"><button class="secondary" onclick="prev()">上一题</button><button onclick="next()">${idx===QUESTIONS.length-1?"查看结果":"下一题"}</button></div>
</div>`}
function save(){const e=document.querySelector('input[name=ans]:checked');if(!e)return false;answers[idx]=+e.value;return true}
function next(){if(!save())return alert("请选择一个答案");if(idx<QUESTIONS.length-1){idx++;renderQ()}else{result=calc();lead()}}
function prev(){if(idx>0){idx--;renderQ()}}
function score(i,a){return ((i===0||i===1)&&a===4)?1:a+1}
function calc(){let s=Object.fromEntries(DIMS.map(d=>[d,0]));answers.forEach((a,i)=>s[QUESTIONS[i][0]]+=score(i,a));return Object.fromEntries(DIMS.map(d=>[d,Math.round(s[d]/16*100)]))}
function classify(s){
if(s["执行能力"]>=75&&s["基础水平"]>=65)return["稳扎稳打型","基础与执行相对稳定，下一阶段可强化专项能力、速度和考试节奏。"];
if(s["学习效率"]<60&&s["执行能力"]>=65)return["效率提升型","执行力不错，但单位时间的有效学习还有提升空间。"];
if(s["基础水平"]<60)return["基础突破型","当前更适合先建立知识体系，再逐步增加专项和套题训练。"];
if(s["执行能力"]>=75&&s["基础水平"]<70)return["坚持成长型","坚持是优势，下一步重点是把学习时间转化为有效训练。"];
if(s["应试能力"]>=75&&s["基础水平"]>=65)return["临考冲刺型","已有一定基础和应试能力，可以逐步转向套题、限时和查漏补缺。"];
return["方向梳理型","当前更值得先明确目标、阶段任务和每日学习路径。"];
}
function tips(s){let a=[];if(s["基础水平"]<65)a.push("先建立基础框架，再增加套题量。");if(s["学习效率"]<65)a.push("每次学习设置明确任务，做完记录错误原因。");if(s["执行能力"]<65)a.push("设置每日最低任务量，避免完全中断。");if(s["应试能力"]<65)a.push("每周安排限时训练，建立做题取舍。");if(s["备考状态"]<65)a.push("明确考试目标与时间节点，再拆成周计划。");return (a.length?a:["保持稳定节奏，加强错题复盘。","每周做一次阶段复盘，根据数据调整重点。","优先提升单位时间有效训练量。"]).slice(0,3)}
function lead(){
app.innerHTML=`<div class="card"><div class="type">测评完成</div><h2>你的AI备考画像已经生成</h2>
<p>填写信息后查看完整报告，并领取你的7天备考行动建议。</p>
<input id="name" class="input" placeholder="姓名/称呼（必填）">
<input id="phone" class="input" type="tel" inputmode="numeric" maxlength="11" placeholder="手机号（必填）">
<input id="wechat" class="input" placeholder="微信号（选填）">
<div class="consent"><input id="agree" type="checkbox"><span>我同意山西考德上将本次提交的联系方式用于活动资料领取、备考服务及课程/活动联系。</span></div>
<button onclick="submitLead()">提交并查看完整报告</button></div>`}
function validPhone(p){return /^1[3-9]\d{9}$/.test(p)}
async function submitLead(){
const name=document.getElementById("name").value.trim(),phone=document.getElementById("phone").value.trim(),wechat=document.getElementById("wechat").value.trim(),agree=document.getElementById("agree").checked;
if(!name)return alert("请填写姓名或称呼");if(!validPhone(phone))return alert("请输入正确的11位手机号");if(!agree)return alert("请勾选信息使用同意项");
const c=classify(result),t=tips(result);
const payload={name,phone,wechat,scores:result,type:c[0],tips:t,answers,submittedAt:new Date().toISOString(),source:"公考AI实验室V3正式活动版"};
if(API_URL){try{await fetch(API_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)})}catch(e){}}
showReport(name,phone,c,t)
}
function showReport(name,phone,c,t){
app.innerHTML=`<div class="card"><div class="type">山西考德上 · 公考AI实验室</div><div class="report-title">${name}的备考画像</div><h3>${c[0]}</h3><p>${c[1]}</p>
<div class="grid">${DIMS.map(d=>`<div class="score">${d}<b>${result[d]}</b></div>`).join("")}</div>
<h3>AI备考建议</h3><ul>${t.map(x=>`<li>${x}</li>`).join("")}</ul>
<h3>7天行动计划</h3><ol><li>明确本周3项核心学习任务。</li><li>完成一次专项限时训练。</li><li>整理典型错题并记录原因。</li><li>完成一次阶段复盘。</li><li>强化当前薄弱模块。</li><li>完成一次模拟或套题训练。</li><li>根据本周数据调整下一周计划。</li></ol>
<div class="notice">感谢参与山西考德上公考AI实验室。本报告用于备考规划参考，不代表对考试结果的预测。</div></div>
<div class="card"><button onclick="window.print()">保存/打印报告</button><br><br><button class="secondary" onclick="home()">返回首页</button></div>`}
home();
</script></body></html>
